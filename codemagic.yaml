# Codemagic CI — builds the iOS app on a cloud Mac and uploads it to TestFlight.
# Setup steps (one-time, in the Codemagic and App Store Connect UIs): see docs/ios-codemagic-setup.md

workflows:
  ios-testflight:
    name: iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45

    integrations:
      # Name of the App Store Connect API key as saved in Codemagic → Team settings → Integrations
      app_store_connect: Levain ASC Key

    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.inbal.levain
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        # Numeric "Apple ID" of the app, from App Store Connect → App Information
        APP_STORE_APPLE_ID: "6828526036"

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "ios-v*"

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Build web assets and sync iOS project
        script: |
          npm run build
          npx cap sync ios

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Set build number (latest TestFlight build + 1)
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          NEXT=$((LATEST + 1))
          echo "Build number: $NEXT"
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $NEXT;/g" "$XCODE_PROJECT/project.pbxproj"

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
