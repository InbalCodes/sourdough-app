# Codemagic CI — builds the iOS app on a cloud Mac and uploads it to TestFlight.
# Setup steps (one-time, in the Codemagic and App Store Connect UIs): see docs/ios-codemagic-setup.md

workflows:
  ios-testflight:
    name: iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45

    integrations:
      # Name of the App Store Connect API key as saved in Codemagic → Team settings → Integrations
      app_store_connect: Levain ASC Key

    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.inbal.levain
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        # Numeric "Apple ID" of the app, from App Store Connect → App Information
        APP_STORE_APPLE_ID: "6828526036"

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "ios-v*"

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Build web assets and sync iOS project
        script: |
          npm run build
          npx cap sync ios

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Set build number (latest TestFlight build + 1)
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          NEXT=$((LATEST + 1))
          echo "Build number: $NEXT"
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $NEXT;/g" "$XCODE_PROJECT/project.pbxproj"

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

      # Runs before publishing: if the symbols can't be uploaded, nothing reaches TestFlight.
      # Same step as ClearCut (the Xcode upload phase hides its own failures).
      - name: Upload dSYM to Crashlytics (must succeed)
        script: |
          set -eu
          DERIVED="$HOME/Library/Developer/Xcode/DerivedData"
          IPA=$(find build/ios/ipa -name '*.ipa' | head -1)
          [ -n "$IPA" ] || { echo "error: no IPA found"; exit 1; }
          WORK=$(mktemp -d)
          unzip -q "$IPA" 'Payload/App.app/App' -d "$WORK"
          APP_UUID=$(dwarfdump --uuid "$WORK/Payload/App.app/App" | awk 'NR==1 {print $2}')
          [ -n "$APP_UUID" ] || { echo "error: could not read the app UUID"; exit 1; }
          echo "App binary UUID: $APP_UUID"

          UPLOADER=$(find "$DERIVED" -type f -path '*/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/upload-symbols' 2>/dev/null | head -1 || true)
          [ -n "$UPLOADER" ] || { echo "error: upload-symbols not found"; exit 1; }

          # Only the dSYM whose UUID matches the shipped binary is useful to Crashlytics.
          MATCH=""
          for CANDIDATE in $(find build/ios "$DERIVED" -type d -name 'App.app.dSYM' 2>/dev/null || true); do
            if dwarfdump --uuid "$CANDIDATE" | grep -q "$APP_UUID"; then MATCH="$CANDIDATE"; break; fi
          done
          [ -n "$MATCH" ] || { echo "error: no dSYM matches UUID $APP_UUID"; exit 1; }
          echo "Matching dSYM: $MATCH"

          mkdir -p build/ios/dsym
          ditto -c -k --keepParent "$MATCH" build/ios/dsym/App.app.dSYM.zip
          "$UPLOADER" -gsp ios/App/App/GoogleService-Info.plist -p ios "$MATCH"
          echo "dSYM uploaded for UUID $APP_UUID"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/dsym/*.zip
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
