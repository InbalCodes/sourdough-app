// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.1'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// @capacitor/local-notifications asks Gradle for exactly a Java 21 toolchain (kotlin { jvmToolchain(21) }), but Android
// Studio ships a newer Java. Compile plugins with the Java that runs Gradle; the bytecode still targets Java 21.
// (Same fix as RockSure.)
subprojects {
    afterEvaluate {
        def kotlinExt = extensions.findByName("kotlin")
        if (kotlinExt != null) {
            kotlinExt.jvmToolchain(JavaVersion.current().majorVersion as int)
            def target = kotlinExt.compilerOptions.jvmTarget
            target.set(Enum.valueOf(target.get().getClass(), "JVM_21"))
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
