[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
  # Skip deploys (15 credits each) unless the site, functions or build files changed.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src public netlify netlify.toml index.html package.json package-lock.json vite.config.ts"

# The old login/recipe functions stay for v1 users until about February 2027 (see phone-apps/apps/levain/PLAN.md).

# Redirect /api/login to the serverless function
[[redirects]]
  from = "/api/login"
  to = "/.netlify/functions/login"
  status = 200

[[redirects]]
  from = "/api/recipes"
  to = "/.netlify/functions/recipes"
  status = 200

[[redirects]]
  from = "/api/google-callback"
  to = "/.netlify/functions/google-callback"
  status = 200

[[redirects]]
  from = "/api/account"
  to = "/.netlify/functions/account"
  status = 200

[[redirects]]
  from = "/api/apple-auth"
  to = "/.netlify/functions/apple-auth"
  status = 200
